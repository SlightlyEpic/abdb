[package]
name = "abdb"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.31"
sqlparser = "0.60.0"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["sync", "fs", "io-util", "net", "macros", "rt-multi-thread", "time"] }
zerocopy = { version = "0.8.31", features = ["derive"] }
